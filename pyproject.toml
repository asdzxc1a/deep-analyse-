[project]
name = "deep-analysis-system"
version = "0.1.0"
description = "Reconstruction-grade repo analysis and blueprint generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "gitpython>=3.1.43",
  "jinja2>=3.1.4",
  "networkx>=3.3",
  "pathspec>=0.12.1",
  "pydantic>=2.8.2",
  "pyyaml>=6.0.2",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
]

[project.scripts]
deep-analysis = "deep_analysis.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
